# 浙江省初中数学知识点树（浙教版） v0
#
# 这是 student-kpscan 的核心资产：错题识别后归类、知识点薄弱统计都依赖它。
# v0 = 大模型按浙教版教材目录生成的起步版，未经考纲校准。考纲电子版到位后按真实考纲校准替换。
# 校准规则见同目录 README.md。识别归类时，模型只能从本表的 id 中选，不得自造。

meta:
  name: 浙江省初中数学知识点树
  textbook: 浙教版（义务教育教科书 数学）
  scope: 七年级上册 至 九年级下册（初中数学全册）
  version: v0
  status: 大模型按教材目录生成的起步版，待浙江中考考纲电子版校准替换
  generated: 2026-06-01
  id_scheme: "册码.章.节.点。例 8A.2.7.1 = 八年级上册 第2章 第7节 第1个知识点。册码 7A/7B/8A/8B/9A/9B = 七上/七下/八上/八下/九上/九下"
  levels: [册, 章, 节, 点]
  reserved_fields: "考频(exam_freq)、难度(difficulty) 为迭代2预留，v0 不填，避免无依据数据"
  calibration_notes:
    - 章、节结构对齐浙教版教材目录；点级为常见知识点拆分，非考纲原文表述。
    - 校准时以浙江中考考纲为准修订 name 与层级；尽量保留已有 id 稳定，避免历史统计错位。
    - 不确定项（如某章节归属册次、梯形是否独立成节）已在该处加 note 标注，校准优先核对。

